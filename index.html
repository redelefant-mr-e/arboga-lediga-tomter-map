<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lediga tomter – karta | Arboga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="lediga-tomter-map.css" />
  </head>
  <body class="arboga-tomter-embed">
    <div class="arboga-tomter-app" data-arboga-tomter-app>
      <div
        class="arboga-tomter-map"
        data-arboga-tomter-map
        role="region"
        aria-label="Karta över lediga tomter i Arboga"
      >
        <div class="arboga-tomter-map__status" data-arboga-map-status>
          Laddar karta…
        </div>
        <div class="arboga-tomter-map__canvas" data-arboga-map-canvas></div>
      </div>
      <nav
        class="arboga-tomter-list"
        data-arboga-tomter-list
        aria-label="Lediga tomter områden"
      ></nav>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="lediga-tomter-map.js"></script>
  </body>
</html>

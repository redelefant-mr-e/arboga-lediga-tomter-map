<!DOCTYPE html>
<!--
  Arboga Lediga Tomter Map — embed shell

  Embed options
  -------------
  1) iframe (recommended for Webflow Custom Code / Embed):
     Desktop:
     <iframe
       src="https://redelefant-mr-e.github.io/arboga-lediga-tomter-map/embed.html"
       title="Karta över lediga tomter i Arboga"
       style="width:100%;height:600px;border:0;"
       loading="lazy"
     ></iframe>

     Mobile (map + list needs more height, e.g.):
     style="width:100%;min-height:900px;height:100vh;border:0;"

  2) Inline Webflow Embed:
     Paste the <link> tags for Leaflet + this CSS, the map markup below,
     then Leaflet JS + lediga-tomter-map.js. Host areas.json next to the JS
     (or set data-areas-url on the root to an absolute URL).

  Assets in this folder:
    embed.html | index.html | lediga-tomter-map.css | lediga-tomter-map.js | areas.json
-->
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lediga tomter – karta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="lediga-tomter-map.css" />
  </head>
  <body class="arboga-tomter-embed">
    <div class="arboga-tomter-app" data-arboga-tomter-app>
      <div
        class="arboga-tomter-map"
        data-arboga-tomter-map
        role="region"
        aria-label="Karta över lediga tomter i Arboga"
      >
        <div class="arboga-tomter-map__status" data-arboga-map-status>
          Laddar karta…
        </div>
        <div class="arboga-tomter-map__canvas" data-arboga-map-canvas></div>
      </div>
      <nav
        class="arboga-tomter-list"
        data-arboga-tomter-list
        aria-label="Lediga tomter områden"
      ></nav>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="lediga-tomter-map.js"></script>
  </body>
</html>
